<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>
</head>
<body>
  <h1>Expense Tracker</h1>

  <!-- User Section -->
  <section>
    <h2>User</h2>
    <input type="text" id="username" placeholder="Username">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="registerUser()">Register</button>
    <button onclick="getUser()">Get User</button>
    <p id="userResult"></p>
  </section>

  <hr>

  <!-- Transaction Section -->
  <section>
    <h2>Transactions</h2>
    <input type="number" id="userId" placeholder="User ID">
    <input type="number" id="amount" placeholder="Amount">
    <input type="text" id="category" placeholder="Category">
    <input type="date" id="date">
    <button onclick="addTransaction()">Add Transaction</button>
    <button onclick="getTransactions()">Get Transactions</button>
    <ul id="transactionList"></ul>
  </section>

  <script>
    const API_BASE = "http://localhost:8083";

    // Register a user
    async function registerUser() {
      const username = document.getElementById("username").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      const response = await fetch(`${API_BASE}/users`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, email, password })
      });

      const data = await response.json();
      document.getElementById("userResult").innerText = "User registered: " + JSON.stringify(data);
    }

    // Get user by username
    async function getUser() {
      const username = document.getElementById("username").value;

      const response = await fetch(`${API_BASE}/users/${username}`);
      if (response.ok) {
        const data = await response.json();
        document.getElementById("userResult").innerText = "User: " + JSON.stringify(data);
      } else {
        document.getElementById("userResult").innerText = "User not found!";
      }
    }

    // Add a transaction
    async function addTransaction() {
      const userId = document.getElementById("userId").value;
      const amount = document.getElementById("amount").value;
      const category = document.getElementById("category").value;
      const date = document.getElementById("date").value;

      const response = await fetch(`${API_BASE}/transactions`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, amount, category, date })
      });

      const message = await response.text();
      alert(message);
    }

    // Get transactions for a user
    async function getTransactions() {
      const userId = document.getElementById("userId").value;

      const response = await fetch(`${API_BASE}/transactions/${userId}`);
      if (response.ok) {
        const transactions = await response.json();
        const list = document.getElementById("transactionList");
        list.innerHTML = "";
        transactions.forEach(t => {
          const li = document.createElement("li");
          li.textContent = `${t.category}: ₹${t.amount} on ${t.date}`;
          list.appendChild(li);
        });
      } else {
        alert("No transactions found!");
      }
    }
  </script>
</body>
</html>
